name: trust
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  trust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.14" }
      - uses: snok/install-poetry@v1
        with: { version: latest }
      - run: poetry install --no-interaction
      - uses: docker/setup-buildx-action@v3
      - uses: CorvidLabs/trust@dd52a7a90ffbc1d2b1030e37007c18274f3d96bc # v1.2.1
        id: trust
        with:
          range: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
